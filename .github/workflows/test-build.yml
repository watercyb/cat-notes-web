name: Test and Build

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: 24
            cache: npm
            cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        run: |
          cat > .env << 'EOF'
          NODE_ENV=development
          PORT=${{ secrets.TEST_PORT }}
          MONGO_URI=${{ secrets.TEST_MONGO_URI }}
          JWT_SECRET=${{ secrets.TEST_JWT_SECRET }}
          REFRESH_TOKEN_SECRET=${{ secrets.TEST_REFRESH_TOKEN_SECRET }}
          UPSTASH_REDIS_REST_URL=${{ secrets.TEST_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.TEST_UPSTASH_REDIS_REST_TOKEN }}
          MAILTRAP_TOKEN=${{ secrets.TEST_MAILTRAP_TOKEN }}
          CLERK_PUBLISHABLE_KEY=${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ secrets.TEST_CLERK_SECRET_KEY }}
          ANALYTICS_TOKEN=${{ secrets.TEST_ANALYTICS_TOKEN }}
          AWS_ACCESS_KEY_ID=${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
          EOF

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create environment file
        working-directory: frontend
        run: |
          cat > .env.production << 'EOF'
          VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.TEST_VITE_CLERK_PUBLISHABLE_KEY }}
          EOF

      - name: Build
        working-directory: frontend
        run: npm run build
